// ========== API CONFIG ==========
const API_URL = "https://filevault-pro-backend.onrender.com/api";

const apiFetch = async (path, options = {}) => {
  const token = localStorage.getItem('filevault_token');
  const headers = { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}), ...options.headers };
  try {
    const res = await fetch(`${API_URL}${path}`, { ...options, headers });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ message: res.statusText }));
      throw new Error(err.message || 'API error');
    }
    return res.json();
  } catch (e) {
    console.warn(`[API] ${path} failed:`, e.message);
    throw e;
  }
};

// ========== STORAGE HELPERS ==========
const STORAGE_KEY = 'filevault_pro_user_isolated';

const saveToStorage = (data) => {
  try {
    const toSave = {
      ...data,
      userFolders: data.userFolders,
      userFiles: data.userFiles,
      userTrash: data.userTrash,
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  } catch(e) { console.warn('Storage full'); }
};

const loadFromStorage = () => {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
};

// ========== HELPER ==========
function getFileIcon(type) {
  if (type === 'pdf') return '📄';
  if (type === 'image') return '🖼️';
  if (type === 'video') return '🎬';
  if (type === 'document') return '📋';
  return '📁';
}

function daysInTrash(deletedAt) {
  const diff = Date.now() - new Date(deletedAt).getTime();
  return Math.floor(diff / (1000*60*60*24));
}

function getFileType(name) {
  const ext = name.split('.').pop().toLowerCase();
  if (['pdf'].includes(ext)) return 'pdf';
  if (['doc','docx','xls','xlsx','ppt','pptx','txt','csv'].includes(ext)) return 'document';
  if (['png','jpg','jpeg','gif','bmp','svg','webp'].includes(ext)) return 'image';
  if (['mp4','avi','mov','mkv','webm'].includes(ext)) return 'video';
  return 'document';
}

function formatSize(bytes) {
  if (bytes === 0) return '0 B';
  const k = 1024;
  const sizes = ['B','KB','MB','GB'];
  const i = Math.floor(Math.log(bytes)/Math.log(k));
  return parseFloat((bytes/Math.pow(k,i)).toFixed(1)) + ' ' + sizes[i];
}

  const [searchQuery, setSearchQuery] = useState('');
  const [filterType, setFilterType] = useState('all');

  // Modals
  const [modal, setModal] = useState(null);
  const [modalData, setModalData] = useState({});

  // Upload
  const fileInputRef = useRef(null);
  const profileInputRef = useRef(null);
  const [uploadProgress, setUploadProgress] = useState({});
  const [toast, setToast] = useState(null);

  const t = T[lang];
  const fontClass = lang === 'kh' ? 'font-kh' : 'font-en';

  // ===== CURRENT USER DATA =====
  const currentUserFolders = userFolders[user?.id] || [];
  const currentUserFiles = userFiles[user?.id] || [];
  const currentUserTrash = userTrash[user?.id] || [];

  // ===== PERSIST DATA =====
  useEffect(() => {
    if (!isLoggedIn) return;
    saveToStorage({ users, userFolders, userFiles, userTrash });
  }, [users, userFolders, userFiles, userTrash]);

  // ===== FETCH DATA FROM API ON LOGIN =====
  useEffect(() => {
    if (!isLoggedIn || !user) return;
    (async () => {
      try {
        const [foldersData, filesData] = await Promise.all([
          apiFetch('/folders?userId=' + user.id),
          apiFetch('/files?userId=' + user.id),
        ]);
        if (foldersData && foldersData.folders && foldersData.folders.length) {
          setUserFolders(prev => ({ ...prev, [user.id]: foldersData.folders }));
        }
        if (filesData && filesData.files && filesData.files.length) {
          setUserFiles(prev => ({ ...prev, [user.id]: filesData.files }));
        }
      } catch (e) {
        console.warn('[API] Failed to fetch from backend, using local data:', e.message);
      }
    })();
  }, [isLoggedIn, user && user.id]);

  // Auto-clean trash > 30 days
  useEffect(() => {
    if (!user) return;
    const cleaned = currentUserTrash.filter(f => daysInTrash(f.deletedAt) < 30);
    if (cleaned.length !== currentUserTrash.length) {
      setUserTrash(prev => ({ ...prev, [user.id]: cleaned }));
    }
  }, [currentUserTrash, user]);

  const showToast = (msg, type='success') => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 2500);
  };

  // ===== LOGIN =====
  const handleLogin = async (e) => {
    e.preventDefault();
    setLoginError('');
    try {
      const data = await apiFetch('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ username: loginForm.username, password: loginForm.password }),
      });
      if (data.token) localStorage.setItem('filevault_token', data.token);
      const found = data.user || users.find(u => u.username === loginForm.username && u.password === loginForm.password);
      if (found) {
        setUser(found);
        setIsLoggedIn(true);
      } else {
        setLoginError('Invalid username or password');
      }
    } catch (err) {
      // Fallback to local auth if backend unreachable
      const found = users.find(u => u.username === loginForm.username && u.password === loginForm.password);
      if (found) {
        setUser(found);
        setIsLoggedIn(true);
      } else {
        setLoginError('Invalid username or password');
      }
    }
  };

  // ===== NAVIGATION =====
  const navigate = (page, folderId=null, path=[]) => {
    const newEntry = { page, folderId, path };
    const newHistory = [...navHistory.slice(0, navIndex+1), newEntry];
    setNavHistory(newHistory);
    setNavIndex(newHistory.length - 1);
    setCurrentPage(page);
    setCurrentFolderId(folderId);
    setFolderPath(path);
  };

  const navBack = () => {
    if (navIndex > 0) {
      const entry = navHistory[navIndex - 1];
      setNavIndex(navIndex - 1);
      setCurrentPage(entry.page);
      setCurrentFolderId(entry.folderId);
      setFolderPath(entry.path);
    }
  };

  const navForward = () => {
    if (navIndex < navHistory.length - 1) {
      const entry = navHistory[navIndex + 1];
      setNavIndex(navIndex + 1);
      setCurrentPage(entry.page);
      setCurrentFolderId(entry.folderId);
      setFolderPath(entry.path);
    }
  };

  const navUp = () => {
    if (folderPath.length > 0) {
      const newPath = folderPath.slice(0, -1);
      const parentId = newPath.length > 0 ? newPath[newPath.length-1].id : null;
      navigate('dashboard', parentId, newPath);

  // ===== FOLDER OPERATIONS =====
  const openFolder = (folder) => {
    if (folder.isLocked) {
      setModal('pinFolder');
      setModalData({ folder });
      return;
    }
    doOpenFolder(folder);
  };

  const doOpenFolder = (folder) => {
    const newPath = [...folderPath, { id: folder.id, name: folder.name }];
    navigate('dashboard', folder.id, newPath);
  };

  const handleCreateFolder = async (name, color, parentId) => {
    if (!name.trim()) return;
    const existing = currentUserFolders.find(f => f.name === name && f.parentId === parentId);
    if (existing) { showToast(t.confirmSave, 'warn'); return; }
    
    const newId = Math.max(...currentUserFolders.map(f=>f.id), 0) + 1;
    const newF = { id: newId, name, color: color||'#3B82F6', icon: '📁', parentId, isLocked: false, pin: '' };
    
    setUserFolders(prev => ({
      ...prev,
      [user.id]: [...(prev[user.id] || []), newF]
    }));
    setModal(null);
    showToast(`Folder "${name}" created!`);
    try {
      await apiFetch('/folders', {
        method: 'POST',
        body: JSON.stringify({ name, color: color||'#3B82F6', parentId, userId: user.id }),
      });
    } catch (e) { console.warn('[API] Folder create sync failed:', e.message); }
  };

  const handleDeleteFolder = (folder) => {
    setModal('confirmDeleteFolder');
    setModalData({ folder });
  };

  const doDeleteFolder = (folder) => {
    const collectIds = (parentId) => {
      const children = currentUserFolders.filter(f => f.parentId === parentId);
      return [parentId, ...children.flatMap(c => collectIds(c.id))];
    };
    const ids = collectIds(folder.id);
    const movedFiles = currentUserFiles.filter(f => ids.includes(f.folderId)).map(f => ({ ...f, deletedAt: new Date().toISOString() }));
    
    setUserTrash(prev => ({
      ...prev,
      [user.id]: [...(prev[user.id] || []), ...movedFiles]
    }));
    setUserFiles(prev => ({
      ...prev,
      [user.id]: prev[user.id].filter(f => !ids.includes(f.folderId))
    }));
    setUserFolders(prev => ({
      ...prev,
      [user.id]: prev[user.id].filter(f => !ids.includes(f.id))
    }));
    
    if (currentFolderId === folder.id) navigate('dashboard', null, []);
    setModal(null);
  };

  const handleLockFolder = (folder) => {
    if (folder.isLocked) {
      setUserFolders(prev => ({
        ...prev,
        [user.id]: prev[user.id].map(f => f.id===folder.id ? {...f, isLocked: false, pin: ''} : f)
      }));
      showToast(`Folder "${folder.name}" unlocked`);
    } else {
      setModal('setPinFolder');
      setModalData({ folder });
    }
  };

  const doSetPinFolder = (folder, pin) => {

      ...prev,
      [user.id]: prev[user.id].map(f => f.id===folder.id ? {...f, isLocked: true, pin} : f)

  const searchFolderResults = searchQuery ? currentUserFolders.filter(f => f.name.toLowerCase().includes(searchQuery.toLowerCase())) : [];

              <Icon.Folder color="white" />
            </div>
            <h1 className="text-4xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">{t.appName}</h1>
            <p className={sub}>User-Isolated File Management</p>
          </div>

          <div className={`${card} border rounded-3xl p-8 shadow-2xl`}>
            <div className="flex justify-between items-center mb-6">
              <div className="flex gap-2">
                <button onClick={()=>setLang('en')} className={`px-3 py-1 rounded-lg text-sm smooth ${lang==='en'?'bg-blue-600 text-white':darkMode?'bg-slate-700 text-slate-300':'bg-slate-200 text-slate-600'}`}>EN</button>
                <button onClick={()=>setLang('kh')} className={`px-3 py-1 rounded-lg text-sm smooth ${lang==='kh'?'bg-blue-600 text-white':darkMode?'bg-slate-700 text-slate-300':'bg-slate-200 text-slate-600'}`}>ខ្មែរ</button>
              </div>
              <button onClick={()=>setDarkMode(!darkMode)} className={`p-2 rounded-lg ${darkMode?'bg-slate-800 text-yellow-400':'bg-slate-200 text-slate-600'}`}>
                {darkMode?<Icon.Sun/>:<Icon.Moon/>}
              </button>
            </div>

            <form onSubmit={handleLogin} className="space-y-4">
              <div>
                <label className={`block text-sm font-medium mb-1 ${text}`}>{t.username}</label>
                <input type="text" value={loginForm.username} onChange={e=>setLoginForm({...loginForm,username:e.target.value})}
                  className={`w-full px-4 py-3 rounded-xl border focus:outline-none focus:border-blue-500 ${input}`} placeholder="admin / john / sarah..." required />
              </div>
              <div>
                <label className={`block text-sm font-medium mb-1 ${text}`}>{t.password}</label>
                <input type="password" value={loginForm.password} onChange={e=>setLoginForm({...loginForm,password:e.target.value})}
                  className={`w-full px-4 py-3 rounded-xl border focus:outline-none focus:border-blue-500 ${input}`} placeholder="admin / 1234" required />
              </div>
              {loginError && <p className="text-red-400 text-sm">{loginError}</p>}
              <button type="submit" className="w-full py-3 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-semibold rounded-xl transition shadow-lg mt-2">{t.login}</button>
            </form>

            <div className={`mt-5 p-3 rounded-xl text-sm ${darkMode?'bg-slate-800 text-slate-400':'bg-slate-100 text-slate-600'}`}>
              👑 <strong>admin</strong> / admin &nbsp;|&nbsp; 👤 john,sarah,mike,lisa / 1234
            </div>
          </div>
        </div>
      </div>
    );
  }

  // ===== PAGE CONTENT =====
  const renderContent = () => {
    // Search
    if (searchQuery && currentPage === 'dashboard') {
      return (
        <div className="space-y-4 fade-in">
          <h3 className={`text-base font-semibold ${text}`}>{t.search.split('...')[0]}: "{searchQuery}"</h3>
          {searchFolderResults.length > 0 && (
            <div>
              <p className={`text-xs uppercase font-bold mb-2 ${sub}`}>{t.folders}</p>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                {searchFolderResults.map(f => <FolderCard key={f.id} folder={f} darkMode={darkMode} text={text} sub={sub} card={card} hover={hover} lang={lang}
                  onOpen={openFolder} onDelete={()=>handleDeleteFolder(f)} onLock={()=>handleLockFolder(f)} onRename={()=>handleRenameItem(f,true)} onSubFolder={()=>{setModal('subFolder');setModalData({parentId:f.id});}} />)}
              </div>
            </div>
          )}
          {searchResults.length > 0 && (
            <div>
              <p className={`text-xs uppercase font-bold mb-2 ${sub}`}>{t.allFiles}</p>
              <div className={viewMode==='grid'?'grid grid-cols-2 md:grid-cols-4 gap-3':'space-y-2'}>
                {searchResults.map(f => <FileCard key={f.id} file={f} darkMode={darkMode} text={text} sub={sub} card={card} hover={hover} lang={lang} viewMode={viewMode}
                  onDelete={()=>handleDeleteFile(f)} onFavorite={()=>handleToggleFavorite(f.id)}
                  onPreview={()=>{ if(f.isPrivate) handleViewPrivateFile(f); else {setModal('preview');setModalData({file:f});}}}
                  onDownload={()=>handleDownload(f)} onLock={()=>handleLockFile(f)} onRename={()=>handleRenameItem(f,false)} />)}
              </div>
            </div>
          )}
          {searchResults.length===0 && searchFolderResults.length===0 && (
            <p className={sub}>{t.noFiles}</p>
          )}
        </div>
      );
    }

    if (currentPage === 'favorites') {
      const favFiles = currentUserFiles.filter(f => f.isFavorite && (!searchQuery || f.name.toLowerCase().includes(searchQuery.toLowerCase())));
      return (
        <div className="fade-in">
          <h3 className={`text-base font-semibold mb-4 ${text}`}>⭐ {t.favorites}</h3>
          {favFiles.length===0 ? <p className={sub}>{t.noFiles}</p> : (
            <div className={viewMode==='grid'?'grid grid-cols-2 md:grid-cols-4 gap-3':'space-y-2'}>
              {favFiles.map(f => <FileCard key={f.id} file={f} darkMode={darkMode} text={text} sub={sub} card={card} hover={hover} lang={lang} viewMode={viewMode}
                onDelete={()=>handleDeleteFile(f)} onFavorite={()=>handleToggleFavorite(f.id)}
                onPreview={()=>{ if(f.isPrivate) handleViewPrivateFile(f); else {setModal('preview');setModalData({file:f});}}}
                onDownload={()=>handleDownload(f)} onLock={()=>handleLockFile(f)} onRename={()=>handleRenameItem(f,false)} />)}
            </div>
          )}
        </div>
      );
    }

    if (currentPage === 'recent') {
      const recentFiles = [...currentUserFiles].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,20)
        .filter(f => !searchQuery || f.name.toLowerCase().includes(searchQuery.toLowerCase()));
      return (
        <div className="fade-in">
          <h3 className={`text-base font-semibold mb-4 ${text}`}>🕐 {t.recent}</h3>
          {recentFiles.length===0 ? <p className={sub}>{t.noFiles}</p> : (
            <div className={viewMode==='grid'?'grid grid-cols-2 md:grid-cols-4 gap-3':'space-y-2'}>
              {recentFiles.map(f => <FileCard key={f.id} file={f} darkMode={darkMode} text={text} sub={sub} card={card} hover={hover} lang={lang} viewMode={viewMode}
                onDelete={()=>handleDeleteFile(f)} onFavorite={()=>handleToggleFavorite(f.id)}
                onPreview={()=>{ if(f.isPrivate) handleViewPrivateFile(f); else {setModal('preview');setModalData({file:f});}}}
                onDownload={()=>handleDownload(f)} onLock={()=>handleLockFile(f)} onRename={()=>handleRenameItem(f,false)} />)}
            </div>
          )}
        </div>
      );
    }

    if (currentPage === 'trash') {
      const validTrash = currentUserTrash.filter(f => daysInTrash(f.deletedAt) < 30 && (!searchQuery || f.name.toLowerCase().includes(searchQuery.toLowerCase())));
      return (
        <div className="fade-in">
          <h3 className={`text-base font-semibold mb-1 ${text}`}>🗑️ {t.trash}</h3>
          <p className={`text-xs mb-4 ${sub}`}>{t.trashInfo}</p>
          {validTrash.length===0 ? <p className={sub}>{t.noFiles}</p> : (
            <div className="space-y-2">
              {validTrash.map(f => (
                <div key={f.id} className={`${card} border rounded-xl p-3 flex items-center gap-3`}>
                  <span className="text-xl">{getFileIcon(f.type)}</span>
                  <div className="flex-1 min-w-0">
                    <p className={`text-sm font-medium truncate ${text}`}>{f.name}</p>
                    <p className={`text-xs ${sub}`}>{30 - daysInTrash(f.deletedAt)} {t.daysLeft}</p>
                  </div>
                  <button onClick={()=>handleRestoreFile(f)} className="px-3 py-1 bg-green-600 hover:bg-green-700 text-white text-xs rounded-lg smooth">{t.restore}</button>
                  <button onClick={()=>setUserTrash(prev=>({...prev,[user.id]:prev[user.id].filter(x=>x.id!==f.id)}))} className="px-3 py-1 bg-red-600/20 hover:bg-red-600/40 text-red-400 text-xs rounded-lg smooth">{t.delete}</button>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    if (currentPage === 'users') {
      return (
        <div className="fade-in">
          <h3 className={`text-base font-semibold mb-4 ${text}`}>👥 {t.users}</h3>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
            {users.map(u => (
              <div key={u.id} className={`${card} border rounded-xl p-4 flex items-center gap-4`}>
                <div className="w-12 h-12 rounded-full overflow-hidden bg-gradient-to-br from-blue-500 to-purple-500 flex items-center justify-center">
                  {u.avatar ? <img src={u.avatar} alt={u.name} className="w-full h-full object-cover"/> : <span className="text-white font-bold text-lg">{u.name[0]}</span>}
                </div>
                <div className="flex-1">
                  <p className={`font-semibold ${text}`}>{u.name}</p>
                  <p className={`text-xs ${sub}`}>{u.role==='admin'?'👑 Admin':'👤 User'} · {u.dept}</p>
                  <p className={`text-xs ${sub}`}>{u.email}</p>
                </div>
                <div className={`text-xs px-2 py-1 rounded ${darkMode?'bg-slate-800 text-slate-400':'bg-slate-200 text-slate-600'}`}>
                  {currentUserFiles.length} files
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // DASHBOARD (folder browser)
    return (
      <div className="space-y-5 fade-in">
        {/* Stats */}
        {folderPath.length === 0 && (
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
            {[
              { label: t.totalFiles, val: currentUserFiles.length, color: 'from-blue-600 to-blue-700', icon: '📄' },
              { label: t.folders, val: currentUserFolders.filter(f=>f.parentId===null).length, color: 'from-purple-600 to-purple-700', icon: '📁' },
              { label: t.favorites, val: currentUserFiles.filter(f=>f.isFavorite).length, color: 'from-yellow-500 to-orange-500', icon: '⭐' },
              { label: t.trash, val: currentUserTrash.filter(f=>daysInTrash(f.deletedAt)<30).length, color: 'from-red-600 to-red-700', icon: '🗑️' },
            ].map(s => (
              <div key={s.label} className={`bg-gradient-to-br ${s.color} rounded-xl p-4 text-white`}>
                <div className="text-2xl mb-1">{s.icon}</div>
                <div className="text-2xl font-bold">{s.val}</div>
                <div className="text-sm opacity-80">{s.label}</div>
              </div>
            ))}
          </div>
        )}

        {/* Upload area */}
        <div className={`${card} border-2 border-dashed rounded-2xl p-6 text-center cursor-pointer ${hover} smooth`}
          onDrop={handleDrop} onDragOver={handleDragOver} onClick={()=>fileInputRef.current?.click()}>
          <div className={`text-3xl mb-2`}>☁️</div>
          <p className={`text-sm ${sub}`}>{t.dropFiles}</p>
          <input type="file" multiple ref={fileInputRef} onChange={handleFileSelect} />
          {Object.keys(uploadProgress).length > 0 && (
            <div className="mt-3 space-y-2">
              {Object.entries(uploadProgress).map(([id, p]) => (
                <div key={id} className={`w-full h-1.5 rounded-full ${darkMode?'bg-slate-700':'bg-slate-300'} overflow-hidden`}>
                  <div className="h-full bg-gradient-to-r from-blue-500 to-purple-500 smooth" style={{width:`${p}%`}}/>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Filter pills */}
        <div className="flex flex-wrap gap-2">
          {['all','pdf','document','image','video'].map(tp => (
            <button key={tp} onClick={()=>setFilterType(tp)}
              className={`px-3 py-1 rounded-full text-xs font-medium smooth ${filterType===tp?'bg-blue-600 text-white':darkMode?'bg-slate-800 text-slate-300 hover:bg-slate-700':'bg-slate-200 text-slate-700 hover:bg-slate-300'}`}>
              {t[tp]||tp}
            </button>
          ))}
        </div>

        {/* Sub-folders */}
        {currentSubFolders.length > 0 && (
          <div>
            <div className="flex items-center justify-between mb-2">
              <p className={`text-xs uppercase font-bold ${sub}`}>{t.folders}</p>
            </div>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
              {currentSubFolders.map(f => (
                <FolderCard key={f.id} folder={f} darkMode={darkMode} text={text} sub={sub} card={card} hover={hover} lang={lang}
                  onOpen={openFolder} onDelete={()=>handleDeleteFolder(f)} onLock={()=>handleLockFolder(f)} onRename={()=>handleRenameItem(f,true)}
                  onSubFolder={()=>{setModal('subFolder');setModalData({parentId:f.id});}} />
              ))}
            </div>
          </div>
        )}

        {/* Files */}
        {currentFiles.length > 0 ? (
          <div>
            <p className={`text-xs uppercase font-bold mb-2 ${sub}`}>{t.allFiles}</p>
            <div className={viewMode==='grid'?'grid grid-cols-2 md:grid-cols-4 gap-3':'space-y-2'}>
              {currentFiles.map(f => (
                <FileCard key={f.id} file={f} darkMode={darkMode} text={text} sub={sub} card={card} hover={hover} lang={lang} viewMode={viewMode}
                  onDelete={()=>handleDeleteFile(f)} onFavorite={()=>handleToggleFavorite(f.id)}
                  onPreview={()=>{ if(f.isPrivate) handleViewPrivateFile(f); else {setModal('preview');setModalData({file:f});}}}
                  onDownload={()=>handleDownload(f)} onLock={()=>handleLockFile(f)} onRename={()=>handleRenameItem(f,false)} />
              ))}
            </div>
          </div>
        ) : currentSubFolders.length === 0 ? (
          <div className="text-center py-12">
            <div className="text-4xl mb-2">📂</div>
            <p className={sub}>{t.noFiles}</p>
          </div>
        ) : null}
      </div>
    );
  };

  return (
    <div className={`flex h-screen ${bg} ${fontClass} overflow-hidden`}>
      {/* SIDEBAR */}
      <div className={`${sidebarOpen?'w-56':'w-0'} ${sidebar} border-r ${border} smooth overflow-hidden flex flex-col shrink-0`}>
        {/* Logo */}
        <div className={`h-16 flex items-center px-4 border-b ${border} gap-3`}>
          <div className="w-8 h-8 rounded-xl bg-gradient-to-br from-blue-600 to-purple-600 flex items-center justify-center">
            <Icon.Folder color="white" />
          </div>
          <span className={`font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent`}>{t.appName}</span>
        </div>

        {/* User info */}
        <div className={`p-3 border-b ${border}`}>
          <div className="flex items-center gap-2 cursor-pointer" onClick={()=>setModal('profile')}>
            <div className="w-9 h-9 rounded-full overflow-hidden bg-gradient-to-br from-blue-500 to-purple-500 flex items-center justify-center relative">
              {user?.avatar ? <img src={user.avatar} alt="" className="w-full h-full object-cover"/> : <span className="text-white font-bold">{user?.name[0]}</span>}
              <div className="absolute inset-0 bg-black/0 hover:bg-black/30 smooth flex items-center justify-center opacity-0 hover:opacity-100 rounded-full">
                <Icon.Camera />
              </div>
            </div>
            <div className="flex-1 min-w-0">
              <p className={`text-sm font-semibold truncate ${text}`}>{user?.name}</p>
              <p className={`text-xs ${sub}`}>{user?.role==='admin'?'👑 Admin':'👤 User'}</p>
            </div>
          </div>
        </div>

        {/* Nav */}
        <nav className="flex-1 p-2 space-y-0.5 overflow-y-auto no-scrollbar">
          {sidebarItems.map(item => (
            <button key={item.page} onClick={item.onClick}
              className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg smooth text-sm ${
                currentPage===item.page ? (darkMode?'bg-blue-600/20 text-blue-400':'bg-blue-100 text-blue-600')
                  : `${sub} ${hover}`}`}>
              <item.icon /> <span>{item.label}</span>
            </button>
          ))}
        </nav>

        {/* Bottom actions */}
        <div className={`p-2 border-t ${border} space-y-1`}>
          <button onClick={async()=>{ try { await apiFetch('/auth/logout', { method: 'POST' }); } catch(e){} localStorage.removeItem('filevault_token'); setIsLoggedIn(false); setUser(null); }}
            className={`w-full flex items-center gap-2 px-3 py-2 rounded-lg smooth text-sm ${darkMode?'text-red-400 hover:bg-red-600/10':'text-red-600 hover:bg-red-50'}`}>
            <Icon.LogOut/> {t.logout}
          </button>
        </div>
      </div>

      {/* MAIN */}
      <div className="flex-1 flex flex-col overflow-hidden">
        {/* TOP NAV */}
        <div className={`h-14 ${darkMode?'bg-slate-900/70':'bg-white/80'} backdrop-blur border-b ${border} px-4 flex items-center gap-3`}>
          {/* Sidebar toggle */}
          <button onClick={()=>setSidebarOpen(!sidebarOpen)} className={`p-1.5 rounded-lg ${hover} ${sub} smooth`}>
            {sidebarOpen?<Icon.X/>:<Icon.Menu/>}
          </button>

          {/* Navigation buttons */}
          <div className="flex items-center gap-1">
            <button onClick={navBack} disabled={navIndex===0}
              className={`p-1.5 rounded-lg smooth ${navIndex===0?'opacity-30 cursor-not-allowed':hover} ${sub}`} title={t.backNav}>
              <Icon.ChevronLeft/>
            </button>
            <button onClick={navForward} disabled={navIndex===navHistory.length-1}
              className={`p-1.5 rounded-lg smooth ${navIndex===navHistory.length-1?'opacity-30 cursor-not-allowed':hover} ${sub}`} title={t.forwardNav}>
              <Icon.ChevronRight/>
            </button>
            <button onClick={navUp} disabled={folderPath.length===0}
              className={`p-1.5 rounded-lg smooth ${folderPath.length===0?'opacity-30 cursor-not-allowed':hover} ${sub}`} title={t.upNav}>
              <Icon.ChevronUp/>
            </button>
          </div>

          {/* Breadcrumb */}
          <div className="flex items-center gap-1 text-sm overflow-x-auto no-scrollbar">
            <button onClick={()=>navigate('dashboard',null,[])} className={`${sub} hover:text-blue-400 smooth whitespace-nowrap`}>FileVault</button>
            {folderPath.map((p,i) => (
              <React.Fragment key={p.id}>
                <span className={sub}>/</span>
                <button onClick={()=>{
                  const newPath = folderPath.slice(0,i+1);
                  navigate('dashboard', p.id, newPath);
                }} className={`hover:text-blue-400 smooth whitespace-nowrap ${i===folderPath.length-1?text:sub}`}>{p.name}</button>
              </React.Fragment>
            ))}
          </div>

          <div className="flex-1"/>

          {/* Search */}
          <div className={`flex items-center gap-2 px-3 py-1.5 rounded-xl border ${darkMode?'bg-slate-800/40 border-slate-700':'bg-slate-100 border-slate-200'} w-48`}>
            <Icon.Search />
            <input value={searchQuery} onChange={e=>setSearchQuery(e.target.value)}
              placeholder={t.search} className={`bg-transparent outline-none text-sm flex-1 ${darkMode?'text-slate-100 placeholder-slate-500':'text-slate-900 placeholder-slate-400'}`}/>
            {searchQuery && <button onClick={()=>setSearchQuery('')} className={`${sub} hover:text-red-400`}><Icon.X/></button>}
          </div>

          {/* Actions */}
          <div className="flex items-center gap-1">
            {/* Lang toggle */}
            <button onClick={()=>setLang(lang==='en'?'kh':'en')} className={`px-2 py-1 rounded-lg text-xs font-bold ${darkMode?'bg-slate-800 text-slate-300 hover:bg-slate-700':'bg-slate-200 text-slate-600 hover:bg-slate-300'} smooth`}>
              {lang==='en'?'ខ្មែរ':'EN'}
            </button>
            <button onClick={()=>setDarkMode(!darkMode)} className={`p-1.5 rounded-lg ${darkMode?'text-yellow-400 hover:bg-slate-800':'text-slate-600 hover:bg-slate-200'} smooth`}>
              {darkMode?<Icon.Sun/>:<Icon.Moon/>}
            </button>
            <button onClick={()=>setViewMode(viewMode==='grid'?'list':'grid')} className={`p-1.5 rounded-lg ${hover} ${sub} smooth`}>
              {viewMode==='grid'?<Icon.List/>:<Icon.Grid/>}
            </button>
          </div>

          {/* New Folder & Upload */}
          <button onClick={()=>{setModal('newFolder');setModalData({parentId:currentFolderId});}}
            className="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm smooth">
            <Icon.FolderPlus/> {t.newFolder}
          </button>
        </div>

        {/* CONTENT */}
        <main className={`flex-1 overflow-auto p-5 ${bg}`}>
          {renderContent()}
        </main>
      </div>

      {/* ===== MODALS ===== */}

      {/* New Folder */}
      {(modal==='newFolder' || modal==='subFolder') && (
        <NewFolderModal darkMode={darkMode} lang={lang} parentId={modalData.parentId}
          onClose={()=>setModal(null)} onCreate={handleCreateFolder} t={t} input={input} text={text} sub={sub} />
      )}

      {/* Profile */}
      {modal==='profile' && (
        <Modal darkMode={darkMode} onClose={()=>setModal(null)} wide>
          <h3 className={`text-base font-bold mb-4 ${text}`}>{t.editProfile}</h3>
          <div className="flex items-center gap-4 mb-5">
            <div className="relative">
              <div className="w-16 h-16 rounded-full overflow-hidden bg-gradient-to-br from-blue-500 to-purple-500 flex items-center justify-center">
                {user?.avatar ? <img src={user.avatar} alt="" className="w-full h-full object-cover"/> : <span className="text-white text-2xl font-bold">{user?.name[0]}</span>}
              </div>
              <button onClick={()=>profileInputRef.current?.click()}
                className="absolute -bottom-1 -right-1 w-6 h-6 bg-blue-600 rounded-full flex items-center justify-center text-white shadow">
                <Icon.Camera />
              </button>
              <input type="file" accept="image/*" ref={profileInputRef} onChange={handleProfilePhotoChange}/>
            </div>
            <div>
              <p className={`font-semibold ${text}`}>{user?.name}</p>
              <p className={`text-sm ${sub}`}>{user?.email}</p>
              <p className={`text-xs ${sub}`}>{user?.role==='admin'?'👑 Admin':'👤 User'} · {user?.dept}</p>
            </div>
          </div>
          <button onClick={()=>profileInputRef.current?.click()}
            className="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl smooth text-sm">
            {t.changePhoto}
          </button>
          <button onClick={()=>setModal(null)} className={`w-full py-2.5 mt-2 rounded-xl text-sm smooth ${darkMode?'bg-slate-800 text-slate-300 hover:bg-slate-700':'bg-slate-200 text-slate-700 hover:bg-slate-300'}`}>
            {t.cancel}
          </button>
        </Modal>
      )}

      {/* Preview */}
      {modal==='preview' && modalData.file && (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={e=>e.target===e.currentTarget&&setModal(null)}>
          <div className={`${darkMode?'bg-slate-900':'bg-white'} rounded-2xl overflow-hidden shadow-2xl max-w-2xl w-full fade-in`}>
            <div className={`flex items-center justify-between px-4 py-3 border-b ${border}`}>
              <div className="flex items-center gap-2">
                <span>{getFileIcon(modalData.file.type)}</span>
                <span className={`font-medium ${text} text-sm truncate max-w-xs`}>{modalData.file.name}</span>
                {modalData.file.isPrivate && <span className="text-xs bg-red-600/20 text-red-400 px-2 py-0.5 rounded-full">🔒 {t.privateFile}</span>}
              </div>
              <div className="flex items-center gap-2">
                <button onClick={()=>handleDownload(modalData.file)} className="p-1.5 text-blue-400 hover:bg-blue-600/20 rounded-lg smooth"><Icon.Download/></button>
                <button onClick={()=>setModal(null)} className={`p-1.5 ${sub} ${hover} rounded-lg smooth`}><Icon.X/></button>
              </div>
            </div>
            <div className="p-4 flex items-center justify-center min-h-48 max-h-96 overflow-auto">
              {modalData.file.type==='image' && modalData.file.dataUrl ? (
                <img src={modalData.file.dataUrl} alt={modalData.file.name} className="max-w-full max-h-80 object-contain rounded-lg"/>
              ) : modalData.file.type==='video' && modalData.file.dataUrl ? (
                <video controls className="max-w-full max-h-80 rounded-lg"><source src={modalData.file.dataUrl}/></video>
              ) : modalData.file.type==='pdf' && modalData.file.dataUrl ? (
                <iframe src={modalData.file.dataUrl} className="w-full h-80 rounded-lg border-0"/>
              ) : (
                <div className="text-center">
                  <div className="text-6xl mb-3">{getFileIcon(modalData.file.type)}</div>
                  <p className={`${sub} text-sm`}>{modalData.file.name}</p>
                  <p className={`${sub} text-xs`}>{modalData.file.size} · {modalData.file.date}</p>
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* Set PIN for file */}
      {modal==='setPinFile' && (
        <PinModal darkMode={darkMode} lang={lang} title={t.setPin} wrongPin={false}
          onSubmit={pin=>doSetPinFile(modalData.file, pin)} onCancel={()=>setModal(null)} />
      )}

      {/* Unlock private file */}
      {modal==='pinUnlockFile' && (
        <PinModal darkMode={darkMode} lang={lang} title={t.enterPin} wrongPin={modalData.wrongPin}
          onSubmit={pin=>doUnlockFile(modalData.file, pin)} onCancel={()=>setModal(null)} />
      )}

      {/* Set PIN for folder */}
      {modal==='setPinFolder' && (
        <PinModal darkMode={darkMode} lang={lang} title={t.setPin} wrongPin={false}
          onSubmit={pin=>doSetPinFolder(modalData.folder, pin)} onCancel={()=>setModal(null)} />
      )}

      {/* Unlock folder */}
      {modal==='pinFolder' && (
        <PinModal darkMode={darkMode} lang={lang} title={t.enterPin} wrongPin={modalData.wrongPin}
          onSubmit={pin=>{
            if (pin===modalData.folder.pin) { setModal(null); doOpenFolder(modalData.folder); }
            else setModalData(prev=>({...prev, wrongPin:true}));
          }} onCancel={()=>setModal(null)} />
      )}

      {/* Confirm delete file */}
      {modal==='confirmDeleteFile' && (
        <ConfirmModal darkMode={darkMode} lang={lang} message={`${t.confirmDelete} "${modalData.file?.name}"`}
          onConfirm={()=>doDeleteFile(modalData.file)} onCancel={()=>setModal(null)} />
      )}

      {/* Confirm delete folder */}
      {modal==='confirmDeleteFolder' && (
        <ConfirmModal darkMode={darkMode} lang={lang} message={`${t.confirmDelete} "${modalData.folder?.name}"?`}
          onConfirm={()=>doDeleteFolder(modalData.folder)} onCancel={()=>setModal(null)} />
      )}

      {/* Rename */}
      {modal==='rename' && (
        <RenameModal darkMode={darkMode} lang={lang} item={modalData.item} isFolder={modalData.isFolder}
          t={t} input={input} text={text} sub={sub} onClose={()=>setModal(null)} onRename={doRename} />
      )}

      {/* Confirm same name on save */}
      {modal==='confirmSave' && (
        <ConfirmModal darkMode={darkMode} lang={lang} message={t.confirmSave}
          onConfirm={()=>{ doUploadFile(modalData.file, modalData.type); setModal(null); }}
          onCancel={()=>setModal(null)} />
      )}

      {/* Toast */}
      {toast && (
        <div className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-xl text-sm fade-in ${toast.type==='error'?'bg-red-600 text-white':toast.type==='warn'?'bg-amber-500 text-white':'bg-green-600 text-white'}`}>
          {toast.msg}
        </div>
      )}
    </div>
  );
}

// ========== FOLDER CARD ==========
function FolderCard({ folder, darkMode, text, sub, card, hover, lang, onOpen, onDelete, onLock, onRename, onSubFolder }) {
  const t = T[lang];
  const [showMenu, setShowMenu] = useState(false);
  return (
    <div className={`${card} border rounded-xl p-3 group relative cursor-pointer ${hover} smooth`} onClick={()=>{ setShowMenu(false); onOpen(folder); }}>
      {folder.isLocked && <span className="absolute top-2 right-2 text-red-400 locked-badge">🔒</span>}
      <div className="flex items-center gap-2 mb-2">
        <span className="text-2xl">📁</span>
        <div className="flex-1 min-w-0">
          <p className={`text-sm font-semibold truncate ${text}`}>{folder.name}</p>
        </div>
      </div>
      <div className="flex items-center gap-1 opacity-0 group-hover:opacity-100 smooth" onClick={e=>e.stopPropagation()}>
        <button onClick={onLock} className="p-1 rounded text-amber-400 hover:bg-amber-400/10 smooth" title={folder.isLocked?t.unlock:t.lock}>
          {folder.isLocked?<Icon.Unlock/>:<Icon.Lock/>}
        </button>
        <button onClick={onSubFolder} className="p-1 rounded text-blue-400 hover:bg-blue-400/10 smooth" title={t.subFolder}><Icon.FolderPlus/></button>
        <button onClick={onDelete} className="p-1 rounded text-red-400 hover:bg-red-400/10 smooth" title={t.delete}><Icon.Trash/></button>
      </div>
    </div>
  );
}

// ========== FILE CARD ==========
function FileCard({ file, darkMode, text, sub, card, hover, lang, viewMode, onDelete, onFavorite, onPreview, onDownload, onLock, onRename }) {
  const t = T[lang];
  if (viewMode === 'list') {
    return (
      <div className={`${card} border rounded-xl px-4 py-2.5 flex items-center gap-3 group ${hover} smooth`}>
        {file.isPrivate ? (
          <span className="text-xl locked-badge">🔒</span>
        ) : file.type==='image' && file.dataUrl ? (
          <img src={file.dataUrl} alt={file.name} className="w-8 h-8 rounded object-cover"/>
        ) : file.type==='video' && file.dataUrl ? (
          <span className="text-xl">🎬</span>
        ) : (
          <span className="text-xl">{getFileIcon(file.type)}</span>
        )}
        <div className="flex-1 min-w-0">
          <p className={`text-sm font-medium truncate ${text}`}>{file.name}</p>
          <p className={`text-xs ${sub}`}>{file.size} · {file.date}</p>
        </div>
        <div className="flex items-center gap-1 opacity-0 group-hover:opacity-100 smooth">
          <button onClick={onFavorite} className={`p-1 rounded smooth ${file.isFavorite?'text-yellow-400':'text-slate-500'} hover:bg-yellow-400/10`}><Icon.Star fill={file.isFavorite}/></button>
          <button onClick={onPreview} className="p-1 rounded text-blue-400 hover:bg-blue-400/10 smooth"><Icon.Eye/></button>
          <button onClick={onDownload} className="p-1 rounded text-green-400 hover:bg-green-400/10 smooth"><Icon.Download/></button>
          <button onClick={onLock} className={`p-1 rounded smooth ${file.isPrivate?'text-red-400 hover:bg-red-400/10':'text-slate-500 hover:bg-slate-500/10'}`}>{file.isPrivate?<Icon.Lock/>:<Icon.Unlock/>}</button>
          <button onClick={onDelete} className="p-1 rounded text-red-400 hover:bg-red-400/10 smooth"><Icon.Trash/></button>
        </div>
      </div>
    );
  }
  return (
    <div className={`${card} border rounded-xl p-3 group ${hover} smooth relative`}>
      {file.isPrivate && <span className="absolute top-2 right-2 text-red-400 locked-badge text-sm">🔒</span>}
      {/* Thumbnail */}
      {!file.isPrivate && file.type==='image' && file.dataUrl ? (
        <img src={file.dataUrl} alt={file.name} className="thumbnail-img cursor-pointer" onClick={onPreview}/>
      ) : !file.isPrivate && file.type==='video' && file.dataUrl ? (
        <video className="thumbnail-vid" onClick={onPreview} style={{cursor:'pointer'}}>
          <source src={file.dataUrl}/>
        </video>
      ) : (
        <div className="text-3xl text-center mb-2 cursor-pointer" onClick={onPreview}>
          {file.isPrivate ? '🔒' : getFileIcon(file.type)}
        </div>
      )}
      <p className={`text-xs font-medium truncate mb-1 ${text}`}>{file.name}</p>
      <p className={`text-xs mb-2 ${sub}`}>{file.size}</p>
      <div className="flex items-center justify-between opacity-0 group-hover:opacity-100 smooth">
        <button onClick={onFavorite} className={`p-1 rounded smooth ${file.isFavorite?'text-yellow-400':'text-slate-500'}`}><Icon.Star fill={file.isFavorite}/></button>
        <button onClick={onPreview} className="p-1 rounded text-blue-400 hover:bg-blue-400/10 smooth"><Icon.Eye/></button>
        <button onClick={onDownload} className="p-1 rounded text-green-400 hover:bg-green-400/10 smooth"><Icon.Download/></button>
        <button onClick={onLock} className={`p-1 rounded smooth ${file.isPrivate?'text-red-400':'text-slate-500'}`}>{file.isPrivate?<Icon.Lock/>:<Icon.Unlock/>}</button>
        <button onClick={onDelete} className="p-1 rounded text-red-400 hover:bg-red-400/10 smooth"><Icon.Trash/></button>
      </div>
    </div>
  );
}

// ========== NEW FOLDER MODAL ==========
function NewFolderModal({ darkMode, lang, parentId, onClose, onCreate, t, input, text, sub }) {
  const [name, setName] = useState('');
  const [color, setColor] = useState('#3B82F6');
  return (
    <Modal darkMode={darkMode} onClose={onClose}>
      <h3 className={`text-base font-bold mb-4 ${text}`}>{parentId !== null ? t.subFolder : t.newFolder}</h3>
      <div className="space-y-3">
        <input value={name} onChange={e=>setName(e.target.value)} placeholder={t.folderName}
          className={`w-full px-4 py-2.5 rounded-xl border focus:outline-none focus:border-blue-500 ${input}`}/>
        <div className="flex items-center gap-2">
          <label className={`text-sm ${sub}`}>Color:</label>
          {['#3B82F6','#EC4899','#8B5CF6','#10B981','#F59E0B','#EF4444'].map(c => (
            <button key={c} onClick={()=>setColor(c)}
              className={`w-6 h-6 rounded-full smooth ${color===c?'ring-2 ring-offset-2 ring-offset-slate-900 ring-white':''}`}
              style={{backgroundColor:c}}/>
          ))}
        </div>
        <div className="flex gap-2 pt-1">
          <button onClick={onClose} className={`flex-1 py-2.5 rounded-xl smooth ${darkMode?'bg-slate-700 text-slate-300 hover:bg-slate-600':'bg-slate-200 text-slate-700 hover:bg-slate-300'}`}>{t.cancel}</button>
          <button onClick={()=>{ if(name.trim()) onCreate(name, color, parentId); }}
            className="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl smooth">{t.createFolder}</button>
        </div>
      </div>
    </Modal>
  );
}

// ========== RENAME MODAL ==========
function RenameModal({ darkMode, lang, item, isFolder, t, input, text, sub, onClose, onRename }) {
  const [value, setValue] = useState(item.name);
  return (
    <Modal darkMode={darkMode} onClose={onClose}>
      <h3 className={`text-base font-bold mb-4 ${text}`}>{t.rename}</h3>
      <input value={value} onChange={e=>setValue(e.target.value)} className={`w-full px-4 py-2.5 rounded-xl border focus:outline-none focus:border-blue-500 mb-4 ${input}`}/>
      <div className="flex gap-2">
        <button onClick={onClose} className={`flex-1 py-2 rounded-xl smooth ${darkMode?'bg-slate-700 text-slate-300':'bg-slate-200 text-slate-700'}`}>{t.cancel}</button>
        <button onClick={()=>onRename(item, isFolder, value)} className="flex-1 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl smooth">{t.save}</button>
      </div>
    </Modal>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
